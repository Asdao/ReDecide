name: Dependency security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dependency-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-security:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: frontend
            node: "24"
          - project: agent-harness
            node: "22"
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.9.0
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: ${{ matrix.project }}/pnpm-lock.yaml
      - name: Check dependency policy and lockfiles
        run: node security/check-lockfiles.mjs
      - name: Install from frozen lockfile
        run: pnpm install --frozen-lockfile
        working-directory: ${{ matrix.project }}
      - name: Audit dependencies
        run: pnpm audit --audit-level=high
        working-directory: ${{ matrix.project }}
      - name: Typecheck
        run: pnpm run typecheck
        working-directory: ${{ matrix.project }}
      - name: Test
        run: pnpm test
        working-directory: ${{ matrix.project }}
      - if: matrix.project == 'frontend'
        name: Lint frontend
        run: pnpm run lint
        working-directory: frontend
      - if: matrix.project == 'frontend'
        name: Build frontend
        run: pnpm run build
        working-directory: frontend
      - if: matrix.project == 'agent-harness'
        name: Build agent harness
        run: pnpm run build
        working-directory: agent-harness

  python-dependency-security:
    name: Python dependency security (${{ matrix.name }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: root
            project: .
            lockfile: uv.lock
            all-extras: true
          - name: backend
            project: backend
            lockfile: backend/uv.lock
            all-extras: false
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.8.17"
      - name: Check frozen lockfile
        run: uv lock --check
        working-directory: ${{ matrix.project }}
      - name: Export frozen hashed dependency graph
        shell: bash
        env:
          REQUIREMENTS_PATH: ${{ runner.temp }}/requirements-${{ matrix.name }}.txt
        run: |
          if [[ "${{ matrix.all-extras }}" == "true" ]]; then
            uv export --frozen --no-emit-project --all-extras --output-file "$REQUIREMENTS_PATH"
          else
            uv export --frozen --no-emit-project --output-file "$REQUIREMENTS_PATH"
          fi
          test -s "$REQUIREMENTS_PATH"
          grep -q -- '--hash=sha256:' "$REQUIREMENTS_PATH"
        working-directory: ${{ matrix.project }}
      - name: Install pinned pip-audit in a temporary environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/pip-audit-venv"
          "$RUNNER_TEMP/pip-audit-venv/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            "pip-audit==2.9.0"
      - name: Audit exported dependency graph
        shell: bash
        env:
          REQUIREMENTS_PATH: ${{ runner.temp }}/requirements-${{ matrix.name }}.txt
        run: |
          "$RUNNER_TEMP/pip-audit-venv/bin/pip-audit" \
            --requirement "$REQUIREMENTS_PATH" \
            --strict
