name: Scheduled dependency audit

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: dependency-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node-audit:
    name: Audit ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: frontend
            node: "24"
          - project: agent-harness
            node: "22"
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.9.0
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: ${{ matrix.project }}/pnpm-lock.yaml
      - name: Check dependency policy and lockfiles
        run: node security/check-lockfiles.mjs
      - name: Install from frozen lockfile
        run: pnpm install --frozen-lockfile
        working-directory: ${{ matrix.project }}
      - name: Audit dependencies
        run: pnpm audit --audit-level=high
        working-directory: ${{ matrix.project }}

  python-audit:
    name: Audit Python ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: .
            label: root
            export_args: --all-extras
          - project: backend
            label: backend
            export_args: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.9.17"
          enable-cache: true
          cache-dependency-glob: ${{ matrix.project }}/uv.lock
      - name: Check frozen lockfile
        run: uv lock --check
        working-directory: ${{ matrix.project }}
      - name: Export locked requirements
        run: >-
          uv export --frozen --project "${{ matrix.project }}" --no-dev
          --no-emit-project ${{ matrix.export_args }} --format requirements.txt
          --output-file "$RUNNER_TEMP/${{ matrix.label }}-requirements.txt"
      - name: Verify hashed export
        run: >-
          grep -q -- '--hash=sha256:'
          "$RUNNER_TEMP/${{ matrix.label }}-requirements.txt"
      - name: Install isolated audit tool
        run: python -m pip install --disable-pip-version-check --no-warn-script-location pip-audit==2.9.0
      - name: Audit locked requirements
        run: >-
          pip-audit --strict --requirement
          "$RUNNER_TEMP/${{ matrix.label }}-requirements.txt"
