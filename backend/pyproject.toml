[project]
name = "ghackathon-backend"
version = "0.1.0"
requires-python = ">=3.12"

# Vercel installs dependencies from this service-local manifest. Keep the
# replay parser and model wheels in the default dependency set because the
# hosted service does not install optional extras from the repository root.
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.7,<3",
    "python-multipart>=0.0.9,<1",
    "uvicorn>=0.34,<1",
    "vercel>=0.5.0,<1",
    "awpy>=2.0.2",
    "lightgbm>=4.0",
    "pyarrow>=15.0",
]

# Vercel flattens this service directory into the function root. ``main.py``
# registers that root as the ``backend`` package so the existing absolute
# imports keep working in both Vercel and repository-root development.
