[project]
name = "cs2-replay-extractor"
version = "0.1.0"
description = "Standalone CS2 demo extraction, normalization, segmentation, and replay storage"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
full = ["awpy>=2.0.2", "pyarrow>=15.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
