[project]
name = "ghackathon"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
full = ["awpy>=2.0.2", "lightgbm>=4.0", "pyarrow>=15.0"]
data = ["fastparquet>=2024.0", "pandas>=2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "Noah",
    "Noah.training",
    "Noah.training.tests",
    "cs2_sim",
    "cs2_sim.core",
    "cs2_sim.core.model",
    "cs2_sim.models",
]
package-dir = {"Noah" = "Noah", "cs2_sim" = "Noah/model/src/cs2_sim"}

[tool.pytest.ini_options]
testpaths = ["Noah/tests", "Noah/model/tests", "Noah/training/tests", "Noah/extractor/tests", "agent-harness/tests"]
addopts = ["--import-mode=importlib"]
pythonpath = ["Noah/model/src", "Noah/extractor/src", "."]
