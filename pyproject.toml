[project]
name = "ghackathon"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.7,<3",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
full = ["awpy>=2.0.2", "lightgbm>=4.0", "pyarrow>=15.0"]
data = ["fastparquet>=2024.0", "pandas>=2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cs2_sim", "cs2_sim.core", "cs2_sim.core.model", "cs2_sim.models", "training"]
package-dir = {"cs2_sim" = "model/src/cs2_sim", "training" = "training"}

[tool.pytest.ini_options]
testpaths = ["model/tests", "training/tests", "extractor/tests", "agent-harness/tests"]
addopts = ["--import-mode=importlib"]
pythonpath = ["model/src", "extractor/src", "."]
