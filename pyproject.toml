[project]
name = "ghackathon"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.7,<3",
    "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
full = ["awpy>=2.0.2", "lightgbm>=4.0", "pyarrow>=15.0"]
data = ["fastparquet>=2024.0", "pandas>=2.0"]
test = ["httpx>=0.27,<1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "Blackbox",
    "Blackbox.training",
    "Blackbox.training.tests",
    "replay_extractor",
    "cs2_sim",
    "cs2_sim.core",
    "cs2_sim.core.model",
    "cs2_sim.models",
]
package-dir = {"Blackbox" = "Blackbox", "replay_extractor" = "Blackbox/extractor/src/replay_extractor", "cs2_sim" = "Blackbox/model/src/cs2_sim"}

[tool.pytest.ini_options]
testpaths = ["backend/tests", "Blackbox/tests", "Blackbox/model/tests", "Blackbox/training/tests", "Blackbox/extractor/tests", "Blackbox/backend demo", "agent-harness/tests"]
addopts = ["--import-mode=importlib"]
pythonpath = ["Blackbox/model/src", "Blackbox/extractor/src", "."]
