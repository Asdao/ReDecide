[project]
name = "ghackathon"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "python-dotenv>=1,<2",
    "pydantic>=2.7,<3",
    "python-multipart>=0.0.9,<1",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
full = ["awpy>=2.0.2", "lightgbm>=4.0", "pyarrow>=15.0"]
data = ["fastparquet>=2024.0", "pandas>=2.0"]
test = ["httpx2>=2.7,<3", "pytest>=8,<9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "backend",
    "backend.app",
    "backend.app.coach",
    "backend.app.replay",
    "backend.replay_api",
    "backend.storage",
    "backend.replay_engine",
    "backend.replay_engine.training",
    "backend.replay_engine.training.tests",
    "replay_extractor",
    "cs2_sim",
    "cs2_sim.core",
    "cs2_sim.core.model",
    "cs2_sim.models",
]
package-dir = {"replay_extractor" = "backend/replay_engine/extractor/src/replay_extractor", "cs2_sim" = "backend/replay_engine/model/src/cs2_sim"}

[tool.pytest.ini_options]
testpaths = ["backend/tests", "backend/replay_engine/tests", "backend/replay_engine/model/tests", "backend/replay_engine/training/tests", "backend/replay_engine/extractor/tests", "backend/replay_engine/backend demo", "agent-harness/tests"]
addopts = ["--import-mode=importlib"]
pythonpath = ["backend/replay_engine/model/src", "backend/replay_engine/extractor/src", "."]
